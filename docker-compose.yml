# Cinebridge - ATV4: sistema containerizado
# Subir:  docker compose up -d --build      (ou docker-compose up -d --build)

services:
  cinebridge-mq:
    image: rabbitmq:3-management-alpine
    container_name: cinebridge-mq
    env_file: ./env/mq.env
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # interface de gerenciamento
    volumes:
      - mq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks: [cinebridge-net]

  profissionais-db:
    image: postgres:15-alpine
    container_name: cinebridge-profissionais-db
    env_file: ./env/profissionais-db.env
    ports:
      - "5433:5432"   # só para inspeção local; remova em produção
    volumes:
      - profissionais-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinebridge -d profissionais"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [cinebridge-net]

  projetos-db:
    image: postgres:15-alpine
    container_name: cinebridge-projetos-db
    env_file: ./env/projetos-db.env
    ports:
      - "5434:5432"   # só para inspeção local; remova em produção
    volumes:
      - projetos-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinebridge -d projetos"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [cinebridge-net]

  notificacoes-db:
    image: postgres:15-alpine
    container_name: cinebridge-notificacoes-db
    env_file: ./env/notificacoes-db.env
    ports:
      - "5435:5432"   # só para inspeção local; remova em produção
    volumes:
      - notificacoes-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinebridge -d notificacoes"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [cinebridge-net]

  cinebridge-profissionais:
    build: ./services/profissionais
    container_name: cinebridge-profissionais
    env_file: ./env/profissionais.env
    ports:
      - "3001:3001"
    depends_on:
      cinebridge-mq:
        condition: service_healthy
      profissionais-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [cinebridge-net]

  cinebridge-projetos:
    build: ./services/projetos
    container_name: cinebridge-projetos
    env_file: ./env/projetos.env
    ports:
      - "3002:3002"
    depends_on:
      cinebridge-mq:
        condition: service_healthy
      projetos-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [cinebridge-net]

  cinebridge-notificacoes:
    build: ./services/notificacoes
    container_name: cinebridge-notificacoes
    env_file: ./env/notificacoes.env
    ports:
      - "3003:3003"
    depends_on:
      cinebridge-mq:
        condition: service_healthy
      notificacoes-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [cinebridge-net]

  cinebridge-api:
    build: .
    container_name: cinebridge-api
    env_file: ./env/api.env
    ports:
      - "3000:3000"
    depends_on:
      cinebridge-mq:
        condition: service_healthy
      cinebridge-profissionais:
        condition: service_healthy
      cinebridge-projetos:
        condition: service_healthy
      cinebridge-notificacoes:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [cinebridge-net]

networks:
  cinebridge-net:
    driver: bridge

volumes:
  mq-data:
  profissionais-db-data:
  projetos-db-data:
  notificacoes-db-data:
